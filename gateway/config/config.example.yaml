mqtt:
  host: "localhost"
  port: 1883
  # 접두사로만 쓰인다. 실행할 때마다 뒤에 다른 꼬리가 붙어 실제 client_id 는
  # 매번 달라진다 — 고정 ID 를 쓰면 같은 ID 로 붙은 다른 인스턴스와 브로커가
  # 서로를 밀어내며 초당 한 번씩 재접속한다(app/main.py 참고).
  client_id: "thermoshift_gateway_1"
  topics:
    - "thermoshift/#"
    - "esp32/device/#"

app:
  # PostgreSQL 접속 정보는 여기가 아니라 환경변수로 준다. api 와 같은
  # 데이터베이스를 본다.
  #   DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME
  # 기본값은 api/db.py 와 동일하다 (localhost:5432 / thermoshift).
  #
  # 담당 공간 ID. null 이면 devices 테이블에 배정된 공간을 자동으로 따른다.
  room_id: null
  control_mode: "shadow"  # shadow, active, manual_lockout, failsafe
  log_level: "INFO"

control:
  decision_interval_sec: 30
  target_temperature_c: 25.0
  cooling_on_temperature_c: 26.5
  cooling_on_duration_sec: 180
  cooling_off_temperature_c: 24.0
  cooling_off_duration_sec: 300
  minimum_on_time_sec: 600
  minimum_off_time_sec: 300
  empty_confirmation_sec: 900
  manual_lockout_sec: 1800
  command_rate_limit_sec: 120
  co2_ventilation_warning_ppm: 1200
  co2_ventilation_warning_duration_sec: 300
  co2_critical_ppm: 1500
  env_data_stale_sec: 120
  occ_data_stale_sec: 180
  # [TARGET] 합성 열원 가진 실험/실공간 데이터로 식별한 뒤에만 설정한다.
  # 0이면 MPC의 재실 발열 feedforward를 비활성화한다.
  internal_heat_drift_c_per_min_per_person: 0.0
  # 전압·전류를 측정해 확인하기 전에는 null. null이면 실제 Wh가 아닌
  # 가동시간 대리지표로 최적화하며 실측 절감률을 주장하지 않는다.
  actuator_power_w: null
  # 정규화 목적함수 가중치. 통제 실험의 민감도 분석 전 설계 기본값이다.
  mpc_weight_energy: 0.45
  mpc_weight_comfort: 14.0
  mpc_weight_switch: 1.2

hmm:
  transition_matrix_30s:
    - [0.985, 0.014, 0.001]
    - [0.100, 0.600, 0.300]
    - [0.003, 0.027, 0.970]

ir:
  # 실제 노드가 구독하는 토픽. 실증 장비를 바꾸면 여기만 고친다.
  # 펠티어(냉각 릴레이)는 평문 "ON"/"OFF" 를, 에어컨은 JSON 을 받는다.
  cooling_topic: "thermoshift/ir_01/cooling/cmd"
  aircon_topic: "esp32/device/ir_01/control"
  codes:
    POWER_OFF: "POWER_OFF_RAW_HASH_PLACEHOLDER"
    COOL_24_AUTO: "COOL_24_AUTO_RAW_HASH_PLACEHOLDER"
    COOL_25_AUTO: "COOL_25_AUTO_RAW_HASH_PLACEHOLDER"
    COOL_26_AUTO: "COOL_26_AUTO_RAW_HASH_PLACEHOLDER"

# 합성 재실자 — 히팅패드로 재실 열부하를 흉내 낸다(app/heater.py).
# 목업이 20x20x30cm(12L) 라 사람을 넣을 수 없어서 둔 장치다.
#
# app.control_mode 의 shadow 상한과는 무관하게 돈다. 그 상한은 '에어컨을
# 건드리지 말라'는 뜻이고 히터는 제어 출력이 아니라 실험 부하다. 오히려
# shadow(냉방 정지) + heater.enabled(가열 가진) 가 개루프 열모델 식별에
# 쓰는 정확한 조합이다.
heater:
  topic: "thermoshift/ir_01/heater/cmd"
  # 켜기 전에 반드시 확인할 것:
  #   - 패드를 알루미늄 판에 붙여 열을 퍼뜨렸는가 (지름 30mm 에 10W 면
  #     전력밀도가 1.4W/cm2 라 벽에 닿으면 아크릴이 변형된다)
  #   - 교반팬이 상시 가동 중인가 (없으면 단일 존 가정이 깨져서 식별
  #     결과가 '잘 맞는 것처럼 보이는 무의미한 숫자' 가 된다)
  #   - 펠티어 방열면이 상자 밖인가
  enabled: false

# CO2 질량보존 기반 '실제 인원수' 추정. 목업의 10W 히터는 열만 만들고
# 사람의 CO2를 만들지 않으므로 목업 실험에서는 반드시 false다. 실제 공간에
# 설치한 뒤 공간 체적과 환기횟수(ACH)를 현장값으로 교정하고 활성화한다.
occupancy_estimator:
  enabled: false
  room_volume_m3: 45.0
  outdoor_co2_ppm: 420.0
  base_ach: 0.35
