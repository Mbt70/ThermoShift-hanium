# 파이 → 클라우드 MQTT 브리지 (방법 B 에서만 사용)
#
# 파이의 mosquitto 가 클라우드 브로커로 아웃바운드 연결을 맺어 토픽을
# 넘긴다. 포트포워딩이 필요 없고, 인터넷이 끊겨도 로컬 제어는 계속된다.
#
#   sudo cp infra/mqtt/bridge.conf /etc/mosquitto/conf.d/bridge.conf
#   sudo systemctl restart mosquitto
#
# 주의: 클라우드 브로커는 반드시 TLS(8883) + 인증을 켤 것.
#       평문 1883 을 공인 IP에 열면 누구나 제어 토픽을 발행할 수 있다.

connection cloud
address <클라우드-호스트>:8883

# 브로커 인증서 검증용 CA. 자체 서명이면 그 CA 파일 경로로 바꾼다.
bridge_cafile /etc/ssl/certs/ca-certificates.crt
bridge_insecure false

remote_clientid thermoshift-pi
remote_username <사용자>
remote_password <비밀번호>

# 센서·상태는 위로(out), 제어 명령은 아래로(in).
topic thermoshift/# out 0
topic esp32/device/# out 0
topic thermoshift/cmd/# in 0

# 연결이 끊긴 동안 쌓인 메시지를 재연결 후 넘긴다.
cleansession false
notifications true
try_private true
restart_timeout 10
